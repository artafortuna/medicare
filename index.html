<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MediCare Pro</title>
    
    <!-- PWA & Favicon Config -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f8fafc" id="meta-theme-color">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">

    <!-- Tailwind & Font (Plus Jakarta Sans for Premium Clarity) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        surface: { light: '#f8fafc', dark: '#0f172a' },
                        card: { light: '#ffffff', dark: '#1e293b' },
                        brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a' },
                        success: { 50: '#ecfdf5', 500: '#10b981', 600: '#059669' }
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                        'float': '0 10px 30px -5px rgba(59, 130, 246, 0.3)',
                    }
                }
            }
        }
    </script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        .bottom-sheet-up { transform: translateY(0); opacity: 1; }
        .bottom-sheet-down { transform: translateY(100%); opacity: 0; }
        .spring-transition { transition: all 0.5s cubic-bezier(0.32, 0.72, 0, 1); }
        .fade-transition { transition: opacity 0.3s ease-out; }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans antialiased min-h-screen flex justify-center transition-colors duration-300">

    <!-- APP CONTAINER (100% width on Mobile, Max-width on Desktop) -->
    <div class="w-full sm:max-w-md sm:mx-auto bg-surface-light dark:bg-surface-dark min-h-screen relative shadow-none sm:shadow-2xl flex flex-col overflow-x-hidden">
        
        <!-- HEADER -->
        <header class="shrink-0 sticky top-0 z-20 bg-surface-light/80 dark:bg-surface-dark/80 backdrop-blur-xl px-5 pt-7 pb-4 transition-colors duration-300">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <!-- Ikon Gambar (Logo Custom) -->
                    <img src="icon.png" alt="Logo" class="w-10 h-10 rounded-2xl object-cover shadow-sm border border-slate-200 dark:border-slate-800 shrink-0">
                    
                    <div>
                        <p class="text-[11px] font-bold text-brand-500 dark:text-brand-400 uppercase tracking-wider mb-0.5" id="greeting-text">Halo,</p>
                        <h1 class="text-xl font-extrabold tracking-tight text-slate-900 dark:text-white leading-none">MediCare Pro</h1>
                    </div>
                </div>
                <button onclick="toggleDarkMode()" class="shrink-0 w-10 h-10 rounded-full bg-white dark:bg-card-dark flex items-center justify-center text-slate-400 hover:text-brand-500 dark:hover:text-brand-400 shadow-soft transition-colors cursor-pointer">
                    <i data-lucide="moon" id="theme-icon" class="w-5 h-5"></i>
                </button>
            </div>
        </header>

        <!-- MAIN CONTENT (Flex-grow pushes footer down) -->
        <main class="flex-grow flex flex-col px-5 pt-2 pb-6">
            
            <!-- PROFILE SELECTOR -->
            <section class="flex items-center justify-between gap-2 mb-6 shrink-0">
                <div id="profile-tabs" class="flex space-x-2 overflow-x-auto scrollbar-hide py-1">
                    <!-- Injected JS -->
                </div>
                <div class="flex shrink-0 border-l pl-2 border-slate-200 dark:border-slate-800">
                    <button onclick="openManageProfilesModal()" class="w-9 h-9 rounded-full bg-white dark:bg-card-dark flex items-center justify-center text-slate-400 hover:text-brand-500 shadow-soft transition-colors cursor-pointer">
                        <i data-lucide="settings-2" class="w-4 h-4"></i>
                    </button>
                </div>
            </section>

            <!-- DASHBOARD CARDS (Health Metrics) -->
            <section class="shrink-0 bg-card-light dark:bg-card-dark rounded-3xl p-5 shadow-soft border border-slate-100 dark:border-slate-800/60 mb-8 transition-colors">
                <div class="flex justify-between items-end mb-4">
                    <div>
                        <h2 class="text-sm font-bold text-slate-800 dark:text-slate-100">Kepatuhan Harian</h2>
                        <p class="text-xs font-medium text-slate-500 dark:text-slate-400 mt-0.5" id="current-date">Memuat tanggal...</p>
                    </div>
                    <div class="text-right">
                        <span class="text-2xl font-extrabold text-brand-500 dark:text-brand-400" id="stat-percentage">0%</span>
                    </div>
                </div>
                
                <!-- Progress Bar -->
                <div class="w-full bg-slate-100 dark:bg-slate-800 rounded-full h-2 mb-5 overflow-hidden">
                    <div id="progress-bar" class="h-2 rounded-full transition-all duration-1000 ease-out bg-gradient-to-r from-brand-500 to-brand-400" style="width: 0%"></div>
                </div>
                
                <div class="grid grid-cols-2 gap-3">
                    <div class="flex items-center space-x-3 bg-brand-50 dark:bg-brand-900/20 p-3 rounded-2xl">
                        <div class="w-8 h-8 rounded-full bg-brand-100 dark:bg-brand-900/50 flex items-center justify-center text-brand-600 dark:text-brand-400"><i data-lucide="list-todo" class="w-4 h-4"></i></div>
                        <div>
                            <p class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Total Sesi</p>
                            <p class="text-sm font-extrabold text-slate-800 dark:text-white" id="stat-total">0</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-3 bg-success-50 dark:bg-success-600/10 p-3 rounded-2xl">
                        <div class="w-8 h-8 rounded-full bg-success-500/20 flex items-center justify-center text-success-600 dark:text-success-500"><i data-lucide="check-circle" class="w-4 h-4"></i></div>
                        <div>
                            <p class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Selesai</p>
                            <p class="text-sm font-extrabold text-slate-800 dark:text-white" id="stat-taken">0</p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- SCHEDULE LIST -->
            <section class="flex-grow flex flex-col relative pb-16">
                <h2 class="text-base font-extrabold text-slate-800 dark:text-slate-100 mb-4 px-1 shrink-0">Jadwal Hari Ini</h2>
                <div id="schedule-list" class="space-y-3.5"></div>

                <!-- EMPTY STATE -->
                <div id="empty-state" class="hidden flex-grow flex flex-col items-center justify-center py-10 text-center">
                    <div class="w-20 h-20 bg-brand-50 dark:bg-card-dark rounded-full flex items-center justify-center mb-4">
                        <i data-lucide="coffee" class="w-8 h-8 text-brand-400"></i>
                    </div>
                    <h3 class="text-sm font-bold text-slate-700 dark:text-slate-200">Semua sehat & beres!</h3>
                    <p class="text-xs text-slate-500 mt-1 mb-5">Belum ada jadwal obat yang ditambahkan.</p>
                    <button onclick="openModalForAdd()" class="bg-brand-500 hover:bg-brand-600 text-white px-5 py-2.5 rounded-full text-xs font-bold transition-transform active:scale-95 cursor-pointer shadow-float">
                        + Buat Jadwal Baru
                    </button>
                </div>
            </section>
        </main>

        <!-- FOOTER (Menempel di dasar) -->
        <footer class="shrink-0 w-full py-4 text-center bg-surface-light dark:bg-surface-dark border-t border-slate-200/60 dark:border-slate-800/60 z-10 relative">
            <p class="text-[10px] font-bold text-slate-400 dark:text-slate-500">&copy; 2026 MediCare by Arta Fortuna. All Rights Reserved.</p>
        </footer>

        <!-- FLOATING ACTION BUTTON (FAB) -->
        <button onclick="openModalForAdd()" class="fixed bottom-20 right-5 md:absolute md:bottom-20 md:right-5 w-14 h-14 bg-brand-500 text-white rounded-full shadow-float flex items-center justify-center hover:bg-brand-600 hover:scale-105 active:scale-95 transition-all z-10 cursor-pointer">
            <i data-lucide="plus" class="w-6 h-6"></i>
        </button>

    </div>

    <!-- BOTTOM SHEET: ADD/EDIT SCHEDULE -->
    <div id="med-modal" class="fixed inset-0 z-50 flex items-end justify-center pointer-events-none">
        <div id="med-modal-backdrop" onclick="closeModal()" class="absolute inset-0 bg-slate-900/20 dark:bg-black/60 backdrop-blur-sm opacity-0 fade-transition"></div>
        <div id="med-modal-content" class="bg-surface-light dark:bg-surface-dark w-full max-w-md rounded-t-[32px] p-6 pb-8 bottom-sheet-down spring-transition shadow-2xl relative max-h-[90vh] flex flex-col border-t border-white/50 dark:border-slate-800">
            <div class="w-12 h-1.5 bg-slate-200 dark:bg-slate-700 rounded-full mx-auto mb-6 shrink-0"></div>
            
            <div class="flex justify-between items-center mb-6 shrink-0">
                <h3 class="font-extrabold text-xl text-slate-800 dark:text-white" id="modal-title">Sesi Obat Baru</h3>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-card-dark flex items-center justify-center text-slate-400 hover:text-slate-800 dark:hover:text-white transition-colors cursor-pointer">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>

            <form id="med-form" onsubmit="handleFormSubmit(event)" class="space-y-4 overflow-y-auto scrollbar-hide pr-1">
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1.5">Untuk Profil</label>
                    <select id="schedule-profile" required class="w-full px-4 py-3.5 rounded-2xl border-0 bg-card-light dark:bg-card-dark shadow-sm text-sm font-bold text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-brand-500 appearance-none outline-none cursor-pointer">
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1.5">Waktu <span class="font-normal">(Opsional)</span></label>
                        <input type="time" id="schedule-time" class="w-full px-4 py-3.5 rounded-2xl border-0 bg-card-light dark:bg-card-dark shadow-sm text-sm font-bold text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-brand-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1.5">Catatan <span class="font-normal">(Opsional)</span></label>
                        <input type="text" id="schedule-notes" placeholder="Cth: Sesudah makan" class="w-full px-4 py-3.5 rounded-2xl border-0 bg-card-light dark:bg-card-dark shadow-sm text-sm font-medium text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-brand-500 outline-none">
                    </div>
                </div>

                <div class="pt-2">
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-2">Daftar Obat</label>
                    <div id="medicine-inputs-container" class="space-y-2.5"></div>
                    <button type="button" onclick="addMedicineInputRow()" class="mt-3 w-full py-3 border-2 border-dashed border-slate-200 dark:border-slate-700 rounded-2xl text-xs font-bold text-brand-500 hover:bg-brand-50 dark:hover:bg-brand-900/20 transition-colors flex items-center justify-center space-x-1.5 cursor-pointer">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        <span>Tambah Resep Lain</span>
                    </button>
                </div>

                <div class="pt-5 shrink-0 pb-2">
                    <button type="submit" class="w-full bg-brand-500 hover:bg-brand-600 text-white font-bold text-sm py-4 rounded-2xl transition-transform active:scale-[0.98] cursor-pointer shadow-float">Simpan Jadwal</button>
                </div>
            </form>
        </div>
    </div>

    <!-- BOTTOM SHEET: MANAGE PROFILES -->
    <div id="manage-profiles-modal" class="fixed inset-0 z-50 flex items-end justify-center pointer-events-none">
        <div id="manage-backdrop" onclick="closeManageProfilesModal()" class="absolute inset-0 bg-slate-900/20 dark:bg-black/60 backdrop-blur-sm opacity-0 fade-transition"></div>
        <div id="manage-content" class="bg-surface-light dark:bg-surface-dark w-full max-w-md rounded-t-[32px] p-6 pb-8 bottom-sheet-down spring-transition shadow-2xl relative border-t border-white/50 dark:border-slate-800">
            <div class="w-12 h-1.5 bg-slate-200 dark:bg-slate-700 rounded-full mx-auto mb-6"></div>
            <h3 class="font-extrabold text-xl text-slate-800 dark:text-white mb-1">Kelola Profil</h3>
            <p class="text-xs font-medium text-slate-500 mb-5">Atur anggota keluarga atau pasien.</p>
            
            <div id="manage-profiles-list" class="space-y-2.5 max-h-[40vh] overflow-y-auto scrollbar-hide mb-6"></div>
            
            <div class="flex space-x-3">
                <button onclick="openAddProfileModal()" class="w-1/2 bg-brand-50 dark:bg-brand-900/30 text-brand-600 dark:text-brand-400 font-bold text-sm py-4 rounded-2xl transition-transform active:scale-[0.98] cursor-pointer">Profil Baru</button>
                <button onclick="closeManageProfilesModal()" class="w-1/2 bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-white font-bold text-sm py-4 rounded-2xl transition-transform active:scale-[0.98] cursor-pointer">Selesai</button>
            </div>
        </div>
    </div>

    <!-- CLEAN POPUP (ALERT / CONFIRM / PROMPT) -->
    <div id="custom-popup" class="fixed inset-0 z-50 flex items-center justify-center pointer-events-none p-5">
        <div id="popup-backdrop" class="absolute inset-0 bg-slate-900/20 dark:bg-black/60 backdrop-blur-sm opacity-0 fade-transition"></div>
        <div id="custom-popup-content" class="bg-card-light dark:bg-card-dark w-full max-w-[320px] rounded-[28px] p-6 transform scale-95 opacity-0 spring-transition shadow-2xl text-center flex flex-col items-center">
            <div id="popup-icon-container" class="mb-4"></div>
            <h3 id="popup-title" class="font-extrabold text-lg text-slate-800 dark:text-white mb-2 leading-tight">Judul</h3>
            <div id="popup-message-wrapper" class="text-sm font-medium text-slate-500 dark:text-slate-400 mb-6 w-full"></div>
            <div id="popup-actions" class="flex w-full space-x-2">
                <!-- Injected JS -->
            </div>
        </div>
    </div>

    <!-- PWA & LOGIC -->
    <script>
        // PWA Config
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
        }

        let db, schedules = [], profiles = ['Kakek', 'Ibu', 'Anak'], activeProfile = 'Kakek', editingId = null, isDarkMode = false;

        // DYNAMIC GREETING
        function updateGreeting() {
            const hour = new Date().getHours();
            let greeting = 'Halo,';
            if(hour >= 5 && hour < 11) greeting = 'Selamat Pagi,';
            else if(hour >= 11 && hour < 15) greeting = 'Selamat Siang,';
            else if(hour >= 15 && hour < 18) greeting = 'Selamat Sore,';
            else greeting = 'Selamat Malam,';
            document.getElementById('greeting-text').innerText = greeting;
        }

        // DATE
        function updateDateHeader() {
            const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
            document.getElementById('current-date').innerText = new Date().toLocaleDateString('id-ID', options);
        }

        // THEME
        async function loadTheme() {
            try {
                const state = await dbGetAll('app_state');
                const themeObj = state.find(i => i.key === 'theme');
                isDarkMode = themeObj ? themeObj.value === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
            } catch (e) { isDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches; }
            applyTheme();
        }

        async function toggleDarkMode() {
            isDarkMode = !isDarkMode;
            try { await dbPut('app_state', { key: 'theme', value: isDarkMode ? 'dark' : 'light' }); } catch(e){}
            applyTheme();
        }

        function applyTheme() {
            const htmlEl = document.documentElement;
            const icon = document.getElementById('theme-icon');
            const metaTheme = document.getElementById('meta-theme-color');
            if (isDarkMode) {
                htmlEl.classList.add('dark');
                if(icon) icon.setAttribute('data-lucide', 'sun');
                metaTheme.setAttribute('content', '#0f172a');
            } else {
                htmlEl.classList.remove('dark');
                if(icon) icon.setAttribute('data-lucide', 'moon');
                metaTheme.setAttribute('content', '#f8fafc');
            }
            lucide.createIcons();
        }

        // DB INIT
        function initDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open('MediCareProDB', 2);
                req.onerror = e => reject(e.target.error);
                req.onsuccess = e => { db = e.target.result; resolve(db); };
                req.onupgradeneeded = e => {
                    const dbi = e.target.result;
                    if (!dbi.objectStoreNames.contains('schedules')) dbi.createObjectStore('schedules', { keyPath: 'id' });
                    if (!dbi.objectStoreNames.contains('app_state')) dbi.createObjectStore('app_state', { keyPath: 'key' });
                };
            });
        }
        function dbGetAll(s) { return new Promise((res, rej) => { const req = db.transaction(s,'readonly').objectStore(s).getAll(); req.onsuccess=()=>res(req.result); req.onerror=()=>rej(req.error); }); }
        function dbPut(s, d) { return new Promise((res, rej) => { const req = db.transaction(s,'readwrite').objectStore(s).put(d); req.onsuccess=()=>res(req.result); req.onerror=()=>rej(req.error); }); }
        function dbDelete(s, k) { return new Promise((res, rej) => { const req = db.transaction(s,'readwrite').objectStore(s).delete(k); req.onsuccess=()=>res(req.result); req.onerror=()=>rej(req.error); }); }

        // LOAD DATA
        async function loadAppData() {
            const todayStr = new Date().toISOString().split('T')[0];
            const profileRecord = await dbGetAll('app_state');
            const profObj = profileRecord.find(i => i.key === 'profiles');
            
            if (profObj && profObj.value) profiles = profObj.value;
            else await dbPut('app_state', { key: 'profiles', value: profiles });

            if (!profiles.includes(activeProfile)) activeProfile = profiles[0] || 'Umum';

            schedules = await dbGetAll('schedules');
            if (schedules.length === 0) {
                schedules = [
                    { id: '1', profile: 'Kakek', time: '08:00', notes: 'Sesudah makan', taken: false, medicines: [{ name: 'Amlodipine', dosage: '5 mg' }] }
                ];
                for (let s of schedules) await dbPut('schedules', s);
            }

            const lastDateObj = profileRecord.find(i => i.key === 'last_date');
            if (lastDateObj?.value !== todayStr) {
                schedules = schedules.map(s => ({ ...s, taken: false }));
                for (let s of schedules) await dbPut('schedules', s);
                await dbPut('app_state', { key: 'last_date', value: todayStr });
            }
        }

        // POPUPS (Themed)
        function openPopupBase(title, htmlMsg, iconHtml) {
            const popup = document.getElementById('custom-popup');
            const backdrop = document.getElementById('popup-backdrop');
            const content = document.getElementById('custom-popup-content');
            
            document.getElementById('popup-title').innerText = title;
            document.getElementById('popup-message-wrapper').innerHTML = htmlMsg;
            document.getElementById('popup-icon-container').innerHTML = iconHtml;
            
            popup.classList.remove('pointer-events-none');
            backdrop.classList.remove('opacity-0');
            content.classList.remove('scale-95', 'opacity-0');
            content.classList.add('scale-100', 'opacity-100');
            
            backdrop.classList.add('pointer-events-auto');
            content.classList.add('pointer-events-auto');
            lucide.createIcons();
        }

        function closeCustomPopup() {
            const popup = document.getElementById('custom-popup');
            const backdrop = document.getElementById('popup-backdrop');
            const content = document.getElementById('custom-popup-content');
            
            backdrop.classList.remove('pointer-events-auto');
            content.classList.remove('pointer-events-auto');
            backdrop.classList.add('opacity-0');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => popup.classList.add('pointer-events-none'), 300);
        }

        function showCustomAlert(title, message) {
            const icon = `<div class="w-14 h-14 rounded-full bg-brand-50 text-brand-500 flex items-center justify-center"><i data-lucide="info" class="w-7 h-7"></i></div>`;
            openPopupBase(title, `<p>${message}</p>`, icon);
            document.getElementById('popup-actions').innerHTML = `
                <button onclick="closeCustomPopup()" class="w-full bg-brand-500 text-white font-bold text-sm py-3.5 rounded-xl active:scale-[0.98] transition-transform cursor-pointer">Tutup</button>
            `;
        }

        function showCustomConfirm(title, message, onConfirm) {
            const icon = `<div class="w-14 h-14 rounded-full bg-red-50 text-red-500 flex items-center justify-center"><i data-lucide="alert-triangle" class="w-7 h-7"></i></div>`;
            openPopupBase(title, `<p>${message}</p>`, icon);
            document.getElementById('popup-actions').innerHTML = `
                <button onclick="closeCustomPopup()" class="w-1/2 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold text-sm py-3.5 rounded-xl active:scale-[0.98] transition-transform cursor-pointer">Batal</button>
                <button id="btn-confirm" class="w-1/2 bg-red-500 text-white font-bold text-sm py-3.5 rounded-xl active:scale-[0.98] transition-transform cursor-pointer shadow-soft">Hapus</button>
            `;
            document.getElementById('btn-confirm').onclick = () => { closeCustomPopup(); onConfirm(); };
        }

        function promptCustomProfile(title, initialValue, onSubmit) {
            const icon = `<div class="w-14 h-14 rounded-full bg-brand-50 text-brand-500 flex items-center justify-center"><i data-lucide="user" class="w-7 h-7"></i></div>`;
            const html = `<input type="text" id="prompt-input" value="${initialValue}" placeholder="Nama (Cth: Ayah)" class="w-full mt-2 px-4 py-3.5 rounded-xl bg-slate-50 dark:bg-slate-800 border-0 text-sm font-bold focus:ring-2 focus:ring-brand-500 outline-none text-center">`;
            openPopupBase(title, html, icon);
            document.getElementById('popup-actions').innerHTML = `
                <button onclick="closeCustomPopup()" class="w-1/2 text-slate-500 dark:text-slate-400 font-bold text-sm py-3.5 cursor-pointer">Batal</button>
                <button id="btn-prompt-save" class="w-1/2 bg-brand-500 text-white font-bold text-sm py-3.5 rounded-xl active:scale-[0.98] transition-transform cursor-pointer shadow-soft">Simpan</button>
            `;
            document.getElementById('btn-prompt-save').onclick = () => {
                const val = document.getElementById('prompt-input').value;
                closeCustomPopup(); onSubmit(val);
            };
            setTimeout(() => document.getElementById('prompt-input').focus(), 100);
        }

        // PROFILES UI
        function renderProfiles() {
            const container = document.getElementById('profile-tabs');
            container.innerHTML = '';
            if (profiles.length === 0) profiles = ['Umum'];
            
            profiles.forEach(prof => {
                const isSelected = prof === activeProfile;
                const btn = document.createElement('button');
                btn.className = `px-5 py-2.5 rounded-full text-[13px] font-bold transition-all shrink-0 cursor-pointer ${isSelected ? 'bg-brand-500 text-white shadow-float' : 'bg-card-light dark:bg-card-dark text-slate-500 shadow-sm border border-slate-100 dark:border-slate-800'}`;
                btn.innerText = prof;
                btn.onclick = () => { activeProfile = prof; renderApp(); };
                container.appendChild(btn);
            });
        }

        function openAddProfileModal() {
            promptCustomProfile('Profil Baru', '', (name) => {
                const clean = name.trim();
                if (clean) {
                    if (profiles.includes(clean)) showCustomAlert('Oops!', 'Nama profil sudah ada.');
                    else { profiles.push(clean); activeProfile = clean; dbPut('app_state',{key:'profiles',value:profiles}).then(renderApp); }
                }
            });
        }

        // BOTTOM SHEETS CONTROLS
        function openManageProfilesModal() {
            const modal = document.getElementById('manage-profiles-modal');
            const backdrop = document.getElementById('manage-backdrop');
            const content = document.getElementById('manage-content');
            const list = document.getElementById('manage-profiles-list');
            list.innerHTML = '';

            profiles.forEach(prof => {
                const row = document.createElement('div');
                row.className = 'flex items-center justify-between p-3.5 rounded-2xl bg-card-light dark:bg-card-dark shadow-sm border border-slate-100 dark:border-slate-800 mb-3';
                row.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 rounded-full bg-brand-50 dark:bg-brand-900/30 text-brand-500 flex items-center justify-center"><i data-lucide="user" class="w-4 h-4"></i></div>
                        <span class="font-bold text-sm text-slate-800 dark:text-slate-100">${prof}</span>
                    </div>
                    <div class="flex space-x-1.5">
                        <button onclick="editProfileName('${prof}')" class="w-8 h-8 rounded-full bg-slate-50 dark:bg-slate-800 flex justify-center items-center text-slate-500 hover:text-brand-500 transition-colors cursor-pointer"><i data-lucide="edit-2" class="w-3.5 h-3.5"></i></button>
                        <button onclick="deleteProfile('${prof}')" class="w-8 h-8 rounded-full bg-slate-50 dark:bg-slate-800 flex justify-center items-center text-slate-400 hover:text-red-500 transition-colors cursor-pointer"><i data-lucide="trash" class="w-3.5 h-3.5"></i></button>
                    </div>
                `;
                list.appendChild(row);
            });

            modal.classList.remove('pointer-events-none');
            backdrop.classList.remove('opacity-0');
            content.classList.remove('bottom-sheet-down');
            content.classList.add('bottom-sheet-up');
            
            backdrop.classList.add('pointer-events-auto');
            content.classList.add('pointer-events-auto');
            lucide.createIcons();
        }

        function closeManageProfilesModal() {
            const modal = document.getElementById('manage-profiles-modal');
            const backdrop = document.getElementById('manage-backdrop');
            const content = document.getElementById('manage-content');
            
            backdrop.classList.remove('pointer-events-auto');
            content.classList.remove('pointer-events-auto');
            backdrop.classList.add('opacity-0');
            content.classList.remove('bottom-sheet-up');
            content.classList.add('bottom-sheet-down');
            setTimeout(() => modal.classList.add('pointer-events-none'), 500);
        }

        async function editProfileName(old) {
            promptCustomProfile(`Edit Nama`, old, async (newName) => {
                const clean = newName.trim();
                if (clean && clean !== old) {
                    if (profiles.includes(clean)) return showCustomAlert('Oops', 'Nama sudah ada.');
                    profiles = profiles.map(p => p === old ? clean : p);
                    for (let s of schedules) { if (s.profile === old) { s.profile = clean; await dbPut('schedules', s); } }
                    if (activeProfile === old) activeProfile = clean;
                    await dbPut('app_state',{key:'profiles',value:profiles});
                    renderApp(); closeManageProfilesModal();
                }
            });
        }

        function deleteProfile(name) {
            if (profiles.length <= 1) return showCustomAlert('Gagal', 'Minimal 1 profil harus tersisa.');
            showCustomConfirm('Hapus Profil', `Hapus "${name}" beserta jadwalnya?`, async () => {
                profiles = profiles.filter(p => p !== name);
                const toDelete = schedules.filter(s => s.profile === name);
                for (let s of toDelete) await dbDelete('schedules', s.id);
                schedules = schedules.filter(s => s.profile !== name);
                if (activeProfile === name) activeProfile = profiles[0];
                await dbPut('app_state',{key:'profiles',value:profiles});
                renderApp(); closeManageProfilesModal();
            });
        }

        // RENDER & CRUD
        function renderApp() {
            renderProfiles();
            const container = document.getElementById('schedule-list');
            const emptyState = document.getElementById('empty-state');
            container.innerHTML = '';
            
            const filtered = schedules.filter(s => s.profile === activeProfile);
            
            if (filtered.length === 0) emptyState.classList.remove('hidden');
            else {
                emptyState.classList.add('hidden');
                filtered.sort((a,b) => (!a.time?1:(!b.time?-1:a.time.localeCompare(b.time))));

                filtered.forEach(item => {
                    const card = document.createElement('div');
                    card.className = `p-5 rounded-[24px] transition-all duration-300 shadow-soft border ${item.taken ? 'bg-success-50/50 dark:bg-success-900/10 border-success-100 dark:border-success-900/30' : 'bg-card-light dark:bg-card-dark border-slate-100 dark:border-slate-800'}`;
                    
                    const medsHtml = item.medicines.map(m => `
                        <div class="flex justify-between items-center py-1.5">
                            <span class="font-bold text-sm ${item.taken?'text-success-600 dark:text-success-500':'text-slate-800 dark:text-slate-200'}">${m.name}</span>
                            ${m.dosage ? `<span class="text-[11px] font-extrabold px-2 py-0.5 rounded-lg ${item.taken ? 'bg-success-100 text-success-600 dark:bg-success-900/50 dark:text-success-400' : 'bg-slate-100 text-slate-500 dark:bg-slate-800 dark:text-slate-400'}">${m.dosage}</span>` : ''}
                        </div>
                    `).join('');

                    card.innerHTML = `
                        <div class="flex items-start justify-between gap-3 relative">
                            <div class="flex-grow space-y-3">
                                <div class="flex items-center gap-2 flex-wrap">
                                    <span class="text-xl font-extrabold ${item.taken ? 'text-success-600 dark:text-success-500' : 'text-slate-900 dark:text-white'}">${item.time ? item.time : 'Fleksibel'}</span>
                                    ${item.notes ? `<span class="text-[10px] font-bold ${item.taken?'text-success-500 bg-success-100 dark:bg-success-900/50':'text-slate-500 bg-slate-100 dark:bg-slate-800'} px-2 py-0.5 rounded-md uppercase tracking-wider">${item.notes}</span>` : ''}
                                </div>
                                <div class="space-y-1 pr-12">
                                    ${medsHtml}
                                </div>
                                <div class="flex space-x-3 pt-2">
                                    <button onclick="openModalForEdit('${item.id}')" class="text-[11px] font-extrabold text-slate-400 hover:text-brand-500 uppercase tracking-wider cursor-pointer transition-colors"><i data-lucide="edit-3" class="w-3.5 h-3.5 inline mr-1 mb-0.5"></i>Edit</button>
                                    <button onclick="deleteSession('${item.id}')" class="text-[11px] font-extrabold text-slate-400 hover:text-red-500 uppercase tracking-wider cursor-pointer transition-colors"><i data-lucide="trash-2" class="w-3.5 h-3.5 inline mr-1 mb-0.5"></i>Hapus</button>
                                </div>
                            </div>
                            <button onclick="toggleSession('${item.id}')" class="absolute top-0 right-0 w-12 h-12 rounded-full flex items-center justify-center transition-all duration-300 cursor-pointer ${item.taken ? 'bg-success-500 text-white shadow-float' : 'bg-slate-100 dark:bg-slate-800 text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700'}">
                                <i data-lucide="${item.taken ? 'check' : 'circle'}" class="w-6 h-6"></i>
                            </button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }
            updateStats(filtered);
            lucide.createIcons();
        }

        function updateStats(filtered) {
            const tot = filtered.length, tak = filtered.filter(s=>s.taken).length;
            const pct = tot > 0 ? Math.round((tak/tot)*100) : 0;
            document.getElementById('stat-total').innerText = tot;
            document.getElementById('stat-taken').innerText = tak;
            document.getElementById('stat-percentage').innerText = pct + '%';
            document.getElementById('progress-bar').style.width = pct + '%';
            document.getElementById('progress-bar').className = `h-2 rounded-full transition-all duration-1000 ease-out ${pct === 100 && tot > 0 ? 'bg-success-500 shadow-float' : 'bg-gradient-to-r from-brand-500 to-brand-400'}`;
        }

        // ADD/EDIT FORM
        function addMedicineInputRow(name='', dose='') {
            const cont = document.getElementById('medicine-inputs-container');
            const div = document.createElement('div');
            div.className = 'flex items-center space-x-2 med-input-row bg-card-light dark:bg-card-dark shadow-sm border border-slate-100 dark:border-slate-800 p-1.5 rounded-2xl';
            div.innerHTML = `
                <input type="text" placeholder="Nama Obat" value="${name}" required class="med-name-input flex-2 px-3 py-2 bg-transparent border-0 text-sm font-bold text-slate-800 dark:text-white focus:ring-0 outline-none w-full placeholder-slate-400">
                <input type="text" placeholder="Dosis" value="${dose}" class="med-dosage-input flex-1 px-3 py-2 bg-transparent border-0 text-sm font-medium text-slate-500 dark:text-slate-400 focus:ring-0 outline-none w-full border-l border-slate-200 dark:border-slate-700 placeholder-slate-400">
                <button type="button" onclick="this.parentElement.remove()" class="p-2 text-slate-300 hover:text-red-500 cursor-pointer transition-colors"><i data-lucide="minus-circle" class="w-5 h-5"></i></button>
            `;
            cont.appendChild(div); lucide.createIcons();
        }

        function populateSelect() {
            const sel = document.getElementById('schedule-profile');
            sel.innerHTML = profiles.map(p => `<option value="${p}" ${p===activeProfile?'selected':''}>${p}</option>`).join('');
        }

        function openModalForAdd() {
            editingId = null;
            document.getElementById('modal-title').innerText = 'Jadwal Baru';
            document.getElementById('schedule-time').value = '';
            document.getElementById('schedule-notes').value = '';
            populateSelect();
            document.getElementById('medicine-inputs-container').innerHTML = '';
            addMedicineInputRow();
            showBottomSheet('med-modal', 'med-modal-backdrop', 'med-modal-content');
        }

        function openModalForEdit(id) {
            editingId = id;
            const s = schedules.find(x => x.id === id);
            if(!s) return;
            document.getElementById('modal-title').innerText = 'Edit Jadwal';
            document.getElementById('schedule-time').value = s.time || '';
            document.getElementById('schedule-notes').value = s.notes || '';
            populateSelect();
            document.getElementById('schedule-profile').value = s.profile;
            const cont = document.getElementById('medicine-inputs-container');
            cont.innerHTML = '';
            s.medicines.forEach(m => addMedicineInputRow(m.name, m.dosage||''));
            showBottomSheet('med-modal', 'med-modal-backdrop', 'med-modal-content');
        }

        function showBottomSheet(mId, bId, cId) {
            const m = document.getElementById(mId), b = document.getElementById(bId), c = document.getElementById(cId);
            m.classList.remove('pointer-events-none');
            b.classList.remove('opacity-0');
            c.classList.remove('bottom-sheet-down'); c.classList.add('bottom-sheet-up');
            b.classList.add('pointer-events-auto');
            c.classList.add('pointer-events-auto');
        }

        function closeModal() {
            const m = document.getElementById('med-modal'), b = document.getElementById('med-modal-backdrop'), c = document.getElementById('med-modal-content');
            b.classList.remove('pointer-events-auto');
            c.classList.remove('pointer-events-auto');
            b.classList.add('opacity-0');
            c.classList.remove('bottom-sheet-up'); c.classList.add('bottom-sheet-down');
            setTimeout(()=> m.classList.add('pointer-events-none'), 500);
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const profile = document.getElementById('schedule-profile').value;
            const time = document.getElementById('schedule-time').value;
            const notes = document.getElementById('schedule-notes').value.trim();
            const meds = Array.from(document.querySelectorAll('.med-input-row')).map(r => ({
                name: r.querySelector('.med-name-input').value.trim(),
                dosage: r.querySelector('.med-dosage-input').value.trim()
            })).filter(m => m.name);

            if(meds.length===0) return showCustomAlert('Oops', 'Masukkan minimal 1 nama obat.');

            if(editingId) {
                schedules = schedules.map(s => {
                    if(s.id === editingId) { const u = {...s,profile,time,notes,medicines:meds}; dbPut('schedules',u); return u; }
                    return s;
                });
            } else {
                const ns = { id: Date.now().toString(), profile, time, notes, taken: false, medicines: meds };
                schedules.push(ns); await dbPut('schedules', ns);
            }
            if(activeProfile !== profile) activeProfile = profile; 
            renderApp(); closeModal();
        }

        async function toggleSession(id) {
            schedules = schedules.map(s => { if(s.id===id) { const u = {...s,taken:!s.taken}; dbPut('schedules',u); return u; } return s; });
            renderApp();
        }

        function deleteSession(id) {
            showCustomConfirm('Hapus Jadwal', 'Apakah Anda yakin ingin menghapus jadwal ini?', async () => {
                schedules = schedules.filter(s => s.id !== id);
                await dbDelete('schedules', id); renderApp();
            });
        }

        // INIT
        window.addEventListener('DOMContentLoaded', async () => {
            updateGreeting(); updateDateHeader();
            await initDB(); await loadTheme(); await loadAppData();
            renderApp(); lucide.createIcons();
        });
    </script>
</body>
</html>
